<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>都道府県 並び替え</title>
<style>
  body {
    font-family: sans-serif;
    background: #fff;
    color: #222;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h2 {
    font-size: 1rem;
    margin-top: 40px;
    margin-bottom: 8px;
    border-bottom: 2px solid #333;
    padding-bottom: 4px;
  }
  .section:first-of-type h2 {
    margin-top: 0;
  }
  .guide {
    font-size: 0.85rem;
    color: #666;
    background: #f7f7f7;
    border: 1px solid #eee;
    padding: 10px 14px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  textarea {
    width: 100%;
    height: 100px;
    font-size: 1rem;
    padding: 10px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  button {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 1rem;
    cursor: pointer;
  }
  .result {
    margin-top: 20px;
    font-size: 1.1rem;
    line-height: 1.8;
  }
  .nameList {
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="section">
  <h2>都道府県・細分区域 並び替え</h2>
  <div class="guide">
    ・地域名をスペース区切りで入力（例: 北海道道東 東京 沖縄本島）<br>
    ・japan_regions_simplified.geojson の区域名・並び順に対応<br>
    ・並び替え後は、入力したときの表記そのまま出力されます
  </div>

  <textarea id="input1" placeholder="北海道道東 東京 沖縄本島"></textarea>
  <br>
  <button onclick="sortByList('input1', 'result1', PREF_ORDER)">並び替え</button>

  <div class="result" id="result1"></div>

  <div class="guide nameList" id="nameList1"></div>
</div>

<div class="section">
  <h2>地方予報区 並び替え</h2>
  <div class="guide">
    ・地方予報区名をスペース区切りで入力（例: 東海 近畿 関東）<br>
    ・forecast_regions_simplified.geojson の区域名・並び順に対応<br>
    ・並び替え後は、入力したときの表記そのまま出力されます
  </div>

  <textarea id="input2" placeholder="東海 近畿 関東"></textarea>
  <br>
  <button onclick="sortByList('input2', 'result2', FORECAST_ORDER)">並び替え</button>

  <div class="result" id="result2"></div>

  <div class="guide nameList" id="nameList2"></div>
</div>

<script>
// japan_regions_simplified.geojson の code 順・name そのまま
const PREF_ORDER = [
  "北海道道央","北海道道南","北海道道北","北海道道東",
  "青森","岩手","宮城","秋田","山形","福島",
  "茨城","栃木","群馬","埼玉","千葉",
  "東京","伊豆諸島","小笠原",
  "神奈川","新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知",
  "三重","滋賀","京都","大阪","兵庫","奈良","和歌山",
  "鳥取","島根","岡山","広島","山口",
  "徳島","香川","愛媛","高知",
  "福岡","佐賀","長崎","熊本","大分","宮崎",
  "鹿児島","奄美(群島)",
  "沖縄本島","大東島","宮古島","八重山"
];

// forecast_regions_simplified.geojson の code 順・name そのまま（地方予報区）
const FORECAST_ORDER = [
  "北海道","東北","関東","伊豆諸島","小笠原","北陸","甲信","東海",
  "近畿","中国","四国","九州","奄美(群島)","沖縄"
];

function buildMap(list) {
  const map = {};
  list.forEach((name, i) => { map[name] = i; });
  return map;
}

const MAP_PREF = buildMap(PREF_ORDER);
const MAP_FORECAST = buildMap(FORECAST_ORDER);

function sortByList(inputId, resultId, list) {
  const map = (list === PREF_ORDER) ? MAP_PREF : MAP_FORECAST;
  const items = document.getElementById(inputId).value.trim().split(/\s+/).filter(Boolean);
  const sorted = items
    .filter(item => item in map)
    .sort((a, b) => map[a] - map[b]);
  document.getElementById(resultId).textContent = sorted.join(' ');
}

document.getElementById('nameList1').textContent = '使える名前一覧：' + PREF_ORDER.join(' / ');
document.getElementById('nameList2').textContent = '使える名前一覧：' + FORECAST_ORDER.join(' / ');
</script>

</body>
</html>
