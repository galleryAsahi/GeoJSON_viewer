<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>都道府県 並び替え</title>
<style>
  body {
    font-family: sans-serif;
    background: #fff;
    color: #222;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
  }
  .guide {
    font-size: 0.85rem;
    color: #666;
    background: #f7f7f7;
    border: 1px solid #eee;
    padding: 10px 14px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  textarea {
    width: 100%;
    height: 100px;
    font-size: 1rem;
    padding: 10px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  button {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 1rem;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    font-size: 1.1rem;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div class="guide">
  ・地域名をスペース区切りで入力（例: 北海道道東 東京 沖縄本島）<br>
  ・japan_regions_simplified.geojson の区域名・並び順に対応<br>
  ・並び替え後は、入力したときの表記そのまま出力されます
</div>

<textarea id="input" placeholder="北海道道東 東京 沖縄本島"></textarea>
<br>
<button onclick="sortPrefectures()">並び替え</button>

<div id="result"></div>

<hr style="margin-top:30px; border:none; border-top:1px solid #eee;">
<div class="guide" id="nameList" style="margin-top:16px;"></div>

<script>
// japan_regions_simplified.geojson の code 順・name そのまま
const PREF_ORDER = [
  "北海道道央","北海道道南","北海道道北","北海道道東",
  "青森","岩手","宮城","秋田","山形","福島",
  "茨城","栃木","群馬","埼玉","千葉",
  "東京","伊豆諸島","小笠原",
  "神奈川","新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知",
  "三重","滋賀","京都","大阪","兵庫","奈良","和歌山",
  "鳥取","島根","岡山","広島","山口",
  "徳島","香川","愛媛","高知",
  "福岡","佐賀","長崎","熊本","大分","宮崎",
  "鹿児島","奄美(群島)",
  "沖縄本島","大東島","宮古島","八重山"
];

const MAP = {};
PREF_ORDER.forEach((name, i) => {
  MAP[name] = i;
});

function sortPrefectures() {
  const items = document.getElementById('input').value.trim().split(/\s+/).filter(Boolean);
  const sorted = items
    .filter(item => item in MAP)
    .sort((a, b) => MAP[a] - MAP[b]);
  document.getElementById('result').textContent = sorted.join(' ');
}

document.getElementById('nameList').textContent = '使える名前一覧：' + PREF_ORDER.join(' / ');
</script>

</body>
</html>
